name: Build ISO
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android || true
      - name: Build ISO in Debian container
        run: docker run --rm --privileged -v "$PWD":/work -w /work debian:bookworm bash build.sh
      - name: Show result
        run: ls -lh MiniOS.iso*
      - uses: actions/upload-artifact@v4
        with:
          name: MiniOS-iso
          path: |
            MiniOS.iso
            MiniOS.iso.sha256
          compression-level: 0
